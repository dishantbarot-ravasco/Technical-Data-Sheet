# render.yaml — Render deployment configuration for TDS Automation App
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: tds-automation
    runtime: python
    # UPGRADED (Ravasco Workspace/Render Pro): was 'free'. The free web-service
    # plan spins down on idle and gives shared/limited CPU — fine for
    # development, not for a system people rely on daily. Verify 'pro' is the
    # exact plan slug currently shown in the Render dashboard for this
    # service before applying this blueprint (Render's plan names/tiers can
    # change independently of this file).
    plan: pro
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: cd django_backend && gunicorn config.wsgi:application --workers 2 --bind 0.0.0.0:$PORT --timeout 120 --log-level info
    # ── Environment variables ───────────────────────────────────────────────────
    envVars:
      # Python version — Render only reads this from an env var, not a top-level key
      - key: PYTHON_VERSION
        value: "3.13.0"
      # Django settings module — always this path (django_backend/config/settings.py)
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      # Production mode — disables DEBUG, enables HSTS, Secure cookies, etc.
      - key: APP_ENV
        value: production
      # Django secret key — auto-generated by Render, stored securely
      - key: TDS_SECRET_KEY
        generateValue: true
      # Shared secret required by GET/POST /api/internal/send-daily-report/
      # (see apps/api/routers/reports_views.py). Set this in Render's env
      # vars and give the SAME value only to your external scheduler
      # (cron-job.org, GitHub Actions secret, etc.) — never expose it to the
      # frontend/browser. Auto-generated here; copy its value from the
      # Render dashboard into that scheduler's config after first deploy.
      - key: REPORT_CRON_SECRET
        generateValue: true
      # Database — auto-filled when you attach the PostgreSQL database below
      - key: DATABASE_URL
        fromDatabase:
          name: tds-db
          property: connectionString
      # ── Custom domain ────────────────────────────────────────────────────────
      # Only needed if you attach a custom domain (e.g. tds.ravasco.com) in the
      # Render dashboard's Custom Domains tab. Render does NOT rewrite
      # RENDER_EXTERNAL_HOSTNAME to it (that stays the *.onrender.com value),
      # so config/settings.py's ALLOWED_HOSTS reads this separately — without
      # it, every request to the custom domain gets rejected with 400
      # DisallowedHost. Leave unset while still on the onrender.com URL.
      - key: CUSTOM_DOMAIN
        sync: false      # e.g. tds.ravasco.com
      # ── Google OAuth — fill these in Render dashboard after deploying ───────
      # Get from: console.cloud.google.com → APIs & Services → Credentials
      # Also add your Render URL to Authorized redirect URIs:
      #   https://your-app-name.onrender.com/api/auth/google/callback/
      - key: GOOGLE_CLIENT_ID
        sync: false      # set manually in Render dashboard
      - key: GOOGLE_CLIENT_SECRET
        sync: false      # set manually in Render dashboard
      - key: GOOGLE_OAUTH_REDIRECT_URI
        sync: false      # e.g. https://your-app-name.onrender.com/api/auth/google/callback/
      # ── Error monitoring ─────────────────────────────────────────────────────
      # Create a free project at sentry.io and paste its DSN here to start
      # getting alerted on production errors instead of them going silent.
      # Now that this is a real production deployment (not free-tier dev),
      # this should be filled in rather than left unset.
      - key: SENTRY_DSN
        sync: false
      # ── Email / SMTP ─────────────────────────────────────────────────────────
      # Sent from dishant.barot@ravasco.com directly (a real, verified
      # Workspace mailbox) rather than a separate noreply@ravasco.com alias —
      # this sidesteps the Gmail-silently-overrides-From-header issue
      # entirely, since SMTP_USER and the From address are the same
      # authenticated account.
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false      # dishant.barot@ravasco.com
      - key: SMTP_PASS
        sync: false      # Gmail App Password for that account (16 chars, no spaces)
      - key: SMTP_FROM
        sync: false      # dishant.barot@ravasco.com

# ── PostgreSQL database ────────────────────────────────────────────────────────
databases:
  - name: tds-db
    databaseName: technical_data_sheet
    user: tds_user
    # UPGRADED (Ravasco Workspace/Render Pro): was 'free'. Render's free
    # Postgres plan is explicitly time-limited (expires ~90 days after
    # creation) and was never viable for real production data — this was the
    # single most urgent pre-launch blocker. Verify the exact plan slug in
    # the Render dashboard (Postgres plan names, e.g. 'pro-4gb', differ from
    # web-service plan names like 'pro') before applying this blueprint.
    plan: pro
