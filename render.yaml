# render.yaml — Render deployment configuration for TDS Automation App
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: tds-automation
    runtime: python
    plan: free
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: cd django_backend && gunicorn config.wsgi:application --workers 2 --bind 0.0.0.0:$PORT --timeout 120 --log-level info
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.0"
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
    

    # ── Environment variables ───────────────────────────────────────────────────
    envVars:
      # Django settings module — always this path (django_backend/config/settings.py)
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings

      # Production mode — disables DEBUG, enables HSTS, Secure cookies, etc.
      - key: APP_ENV
        value: production

      # Django secret key — auto-generated by Render, stored securely
      - key: TDS_SECRET_KEY
        generateValue: true

      # Shared secret for the free-scheduler-triggered daily report endpoint
      # (GET /api/internal/send-daily-report/?secret=...). Auto-generated here;
      # copy the value from the Render dashboard into your scheduler's config
      # (cron-job.org / GitHub Actions secret) after first deploy.
      - key: REPORT_CRON_SECRET
        generateValue: true

      # Database — auto-filled when you attach the PostgreSQL database below
      - key: DATABASE_URL
        fromDatabase:
          name: tds-db
          property: connectionString

      # ── Google OAuth — fill these in Render dashboard after deploying ───────
      # Get from: console.cloud.google.com → APIs & Services → Credentials
      # Also add your Render URL to Authorized redirect URIs:
      #   https://your-app-name.onrender.com/api/auth/google/callback/
      - key: GOOGLE_CLIENT_ID
        sync: false      # set manually in Render dashboard
      - key: GOOGLE_CLIENT_SECRET
        sync: false      # set manually in Render dashboard
      - key: GOOGLE_OAUTH_REDIRECT_URI
        sync: false      # e.g. https://your-app-name.onrender.com/api/auth/google/callback/

      # ── Email / SMTP — fill these in Render dashboard ──────────────────────
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false      # your Gmail address
      - key: SMTP_PASS
        sync: false      # your Gmail App Password (16 chars, no spaces)
      - key: SMTP_FROM
        sync: false      # e.g. noreply@ravasco.com

# ── PostgreSQL database ────────────────────────────────────────────────────────
databases:
  - name: tds-db
    databaseName: technical_data_sheet
    user: tds_user
    plan: free           # Render free PostgreSQL (expires after 90 days — upgrade for production)
